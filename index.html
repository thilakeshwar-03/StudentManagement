<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Student Management System</h1>

    <form action="/add" method="POST">

        <button type="submit">Add Student</button>
    </form>
</div>

</body>
</html>
